<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NurseAI Assistant</title>

<link rel="stylesheet" href="style.css">

<script type="module" src="firebase-config.js"></script>
<script type="module" src="app.js"></script>
</head>

<body>

<h1>🏥 NurseAI Assistant</h1>

<div class="auth-box">

<input type="email" id="email" placeholder="이메일">
<input type="password" id="password" placeholder="비밀번호">

<button id="signupBtn">회원가입</button>
<button id="loginBtn">로그인</button>

</div>

<hr>

<div class="container">

<textarea
id="patientInfo"
placeholder="환자 상태를 입력하세요.
예) 68세 남성, 혈압 상승, 당뇨 병력 있음">
</textarea>

<button id="aiBtn">
AI 간호계획 생성
</button>

<h2>AI 결과</h2>

<div id="result"></div>

<button id="ttsBtn">
🔊 음성으로 듣기
</button>

<button id="saveBtn">
💾 Firestore 저장
</button>

</div>

</body>
</html>
