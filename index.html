<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 스마트 간호 기록지</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #eef2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        h1, h2 { color: #2c3e50; text-align: center; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; }
        input, textarea, button { width: 100%; padding: 12px; border: 1px solid #dcdde1; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        textarea { resize: vertical; min-height: 100px; }
        .btn-primary { background-color: #3498db; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.3s; }
        .btn-primary:hover { background-color: #2980b9; }
        .btn-ai { background-color: #9b59b6; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.3s; }
        .btn-ai:hover { background-color: #8e44ad; }
        .record-card { border-left: 5px solid #3498db; background: #f8f9fa; padding: 20px; margin-top: 20px; border-radius: 8px; position: relative; }
        .record-header { display: flex; justify-content: space-between; font-weight: bold; color: #2c3e50; margin-bottom: 10px; }
        .ai-result { margin-top: 15px; padding: 15px; background-color: #f3e5f5; border-radius: 8px; border-left: 5px solid #9b59b6; font-size: 14px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🩺 AI 스마트 간호 기록지</h1>

    <div>
        <div class="input-group">
            <label for="patient-name">환자명 / 호실</label>
            <input type="text" id="patient-name" placeholder="예: 홍길동 (301호)">
        </div>
        <div class="input-group">
            <label for="vitals">활력징후 (Vitals)</label>
            <input type="text" id="vitals" placeholder="예: BP 120/80, PR 80, RR 20, BT 36.5">
        </div>
        <div class="input-group">
            <label for="nursing-notes">간호 기록 (상세)</label>
            <textarea id="nursing-notes" placeholder="환자의 상태, 호소 내용, 처치 내역을 상세히 적어주세요."></textarea>
        </div>
        <button class="btn-primary" onclick="saveRecord()">기록 저장하기</button>
    </div>

    <h2 style="margin-top: 40px;">최근 업무 기록</h2>
    <div id="records-list"></div>
</div>

<script>
    // 1. 페이지 로드 시 기존 기록 불러오기
    document.addEventListener('DOMContentLoaded', loadRecords);

    // 2. 기록 저장 (localStorage 사용)
    function saveRecord() {
        const name = document.getElementById('patient-name').value;
        const vitals = document.getElementById('vitals').value;
        const notes = document.getElementById('nursing-notes').value;

        if (!name || !notes) {
            alert("환자명과 간호 기록은 필수 입력 사항입니다.");
            return;
        }

        const record = {
            id: Date.now(),
            name: name,
            vitals: vitals,
            notes: notes,
            timestamp: new Date().toLocaleString()
        };

        let records = JSON.parse(localStorage.getItem('nursing_records')) || [];
        records.unshift(record); // 최신 기록을 맨 앞에 추가
        localStorage.setItem('nursing_records', JSON.stringify(records));

        // 입력창 초기화 및 목록 갱신
        document.getElementById('patient-name').value = '';
        document.getElementById('vitals').value = '';
        document.getElementById('nursing-notes').value = '';
        loadRecords();
    }
