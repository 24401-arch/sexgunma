<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간호사 스마트 업무 기록지</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; text-align: center; }
        input, textarea, button { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #3498db; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #2980b9; }
        .record-card { border-left: 5px solid #3498db; background: #f9f9f9; padding: 15px; margin-top: 15px; border-radius: 5px; }
        .action-btns { display: flex; gap: 10px; margin-top: 10px; }
        .action-btns button { background-color: #2ecc71; }
        .action-btns button:hover { background-color: #27ae60; }
        #app-section { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🩺 스마트 간호 기록지</h1>

    <div id="auth-section">
        <h2>로그인 / 회원가입</h2>
        <input type="email" id="email" placeholder="이메일을 입력하세요">
        <input type="password" id="password" placeholder="비밀번호를 입력하세요">
        <button id="login-btn">로그인</button>
        <button id="signup-btn" style="background-color: #95a5a6;">회원가입</button>
    </div>

    <div id="app-section">
        <div style="text-align: right;">
            <button id="logout-btn" style="width: auto; background-color: #e74c3c;">로그아웃</button>
        </div>

        <h2>환자 상태 기록</h2>
        <input type="text" id="patient-name" placeholder="환자명 (예: 홍길동)">
        <input type="text" id="vitals" placeholder="Vitals (예: BP 120/80, PR 80, BT 36.5)">
        <textarea id="nursing-notes" rows="4" placeholder="간호 기록 (증상 및 처치 내용을 입력하세요)"></textarea>
        <button id="save-btn">기록 저장하기</button>

        <h2>최근 기록</h2>
        <div id="records-list"></div>
    </div>
</div>

    });
